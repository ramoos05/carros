{% extends "base.html" %}

{% block content %}

    {% csrf_token %}
    <h1 class="form-title">Entrar</h1>
    <p class="form-subtitle">Acesse sua conta para gerenciar os carros</p>

    <table>
      {{ login_form.as_table }}

    <div class="form-actions">
      <button type="submit" class="btn">Entrar</button>
    </div>
  </form>
{% endblock %}
