{% extends "base.html" %}

{% block content %}
  <style>
    .card {
      max-width: 520px;
      margin: 40px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--danger);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: center;
    }

    .card-header { padding: 32px 32px 0; }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .card-body { padding: 14px 32px 34px; }

    .card-body p {
      color: var(--text-muted);
      margin: 0;
    }

    .card-body p strong { color: var(--text); }

    .card-body .buttons-container { margin-top: 28px; }

    .card .btn-danger {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .card .btn-danger:hover { background-color: #f55; border-color: #f55; }
  </style>
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Deletar Carro</h1>
    </div>
    <div class="card-body">
      <p>Tem certeza que deseja deletar o carro <strong>{{ object.brand }} {{ object.model }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="buttons-container">
          <button type="submit" class="btn btn-danger">Deletar Carro</button>
          <a href="{% url 'car_update' pk=object.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
