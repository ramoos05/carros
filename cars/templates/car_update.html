{% extends "base.html" %}

{% block content %}
  <form method="post" enctype="multipart/form-data" class="form-card wide">
    {% csrf_token %}
    <h1 class="form-title">Editar Carro</h1>
    <p class="form-subtitle">Atualize as informações do veículo</p>
    <table>
      {{ form.as_table }}
    </table>
    <div>
      <div class="buttons-container">
        <input type="submit" value="Salvar Alterações" class="btn btn-primary">
        <a href="{% url 'car_delete' pk=object.pk %}" class="btn btn-danger">Deletar Carro</a>
        <a href="{% url 'cars_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </div>
  </form>
{% endblock %}
